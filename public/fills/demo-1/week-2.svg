<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Паста как в фильме</title>
  <defs>
    <radialGradient id="w2plate" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efeade"/>
    </radialGradient>
  </defs>

  <!-- Стол: льняная скатерть в полоску -->
  <rect width="200" height="200" fill="#e3d2ae"/>
  <g stroke="#d8c69c" stroke-width="8">
    <path d="M-10 24h220M-10 72h220M-10 120h220M-10 168h220"/>
  </g>

  <!-- Тарелка -->
  <circle cx="100" cy="100" r="76" fill="#cfc4a8" opacity=".35"/>
  <circle cx="99" cy="98" r="74" fill="url(#w2plate)"/>
  <circle cx="99" cy="98" r="58" fill="none" stroke="#e6dfcf" stroke-width="2"/>

  <!-- Соус: край нарочно неровный, иначе ровный круг читается как пицца -->
  <path d="M99 45c15-1 29 7 38 19s12 28 7 41-19 24-33 27-30-2-41-12-17-25-14-39 12-27 25-32c6-2 12-4 18-4z" fill="#c8452f"/>
  <path d="M74 60c-12 8-19 22-19 36 0 6 1 11 3 16" fill="none" stroke="#d95c42" stroke-width="7" stroke-linecap="round"/>

  <!-- Паста: клубок нитей поверх соуса -->
  <g fill="none" stroke="#f0c86a" stroke-width="7" stroke-linecap="round">
    <path d="M62 92c8-18 30-26 48-18s26 30 16 46"/>
    <path d="M58 108c14 14 38 16 54 4s18-32 8-44"/>
    <path d="M76 62c-8 14-6 32 6 42s30 10 42-2"/>
    <path d="M130 128c-16 8-36 4-46-10s-8-32 4-42"/>
    <path d="M68 130c18 6 38 0 46-14"/>
    <path d="M118 58c14 10 20 28 14 44"/>
    <path d="M64 74c16-6 34-2 44 12"/>
    <path d="M136 108c-6 16-22 26-38 24"/>
    <path d="M86 138c14 4 30 0 40-10"/>
    <path d="M52 96c2-14 10-25 22-31"/>
  </g>
  <g fill="none" stroke="#e0b455" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M78 100c10-10 26-12 38-4"/>
    <path d="M106 76c8 10 10 24 4 34"/>
  </g>

  <!-- Базилик -->
  <g fill="#4e8b3a">
    <path d="M112 74c8-8 18-9 22-5s-1 14-9 18-14 2-16-2 1-9 3-11z"/>
    <path d="M74 124c-9-6-12-15-9-19s13-2 19 5 6 14 2 16-8-1-12-2z"/>
  </g>

  <!-- Помидорки черри -->
  <g>
    <circle cx="126" cy="112" r="11" fill="#cc3b2a"/>
    <path d="M126 103c4 0 7 3 8 6-4-2-9-2-13 1 0-4 2-7 5-7z" fill="#e0553f"/>
    <circle cx="78" cy="80" r="9" fill="#cc3b2a"/>
    <path d="M78 73c3 0 6 2 6 5-3-2-7-2-10 1 0-3 2-6 4-6z" fill="#e0553f"/>
  </g>

  <!-- Пармезан -->
  <g fill="#fdfcf8" opacity=".9">
    <circle cx="92" cy="66" r="2.4"/>
    <circle cx="108" cy="132" r="2.6"/>
    <circle cx="66" cy="104" r="2.2"/>
    <circle cx="138" cy="86" r="2.2"/>
    <circle cx="96" cy="120" r="2"/>
  </g>

  <!-- Вилка -->
  <g fill="#b7b3a6">
    <rect x="14" y="118" width="7" height="66" rx="3.5"/>
    <path d="M8 118h19v-26a4 4 0 0 0-8 0v14h-3V92a4 4 0 0 0-8 0z"/>
