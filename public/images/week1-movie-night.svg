<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Домашний киновечер: телевизор светится в тёмной комнате, семья на диване">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243252"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8fc0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8fc0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4f9e"/>
      <stop offset="0.5" stop-color="#7cc0ff"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#wall)"/>
  <ellipse cx="200" cy="180" rx="240" ry="205" fill="url(#glow)"/>

  <!-- телевизор -->
  <rect x="70" y="60" width="260" height="154" rx="9" fill="#080d17"/>
  <rect x="78" y="68" width="244" height="138" rx="4" fill="url(#screen)"/>
  <g fill="#12224a" opacity="0.9">
    <path d="M78 174h244v32H78z"/>
    <path d="M100 174l20-44 17 26 24-50 22 68z"/>
    <path d="M214 174l26-56 19 32 17-24 24 48z"/>
  </g>
  <g fill="#fff" opacity="0.85">
    <circle cx="126" cy="96" r="2.2"/><circle cx="178" cy="84" r="1.6"/>
    <circle cx="244" cy="100" r="2.4"/><circle cx="292" cy="86" r="1.7"/>
  </g>
  <path d="M186 174l14-48 14 48z" fill="#fff" opacity="0.55"/>
  <rect x="186" y="214" width="28" height="16" fill="#080d17"/>
  <rect x="152" y="230" width="96" height="8" rx="4" fill="#080d17"/>

  <!-- диван -->
  <path d="M28 400v-96c0-14 11-25 25-25h294c14 0 25 11 25 25v96z" fill="#3b4a6b"/>
  <path d="M28 336h344v14H28z" fill="#4a5c81"/>
  <path d="M28 400v-64h30v64zM342 400v-64h30v64z" fill="#32405d"/>

  <!-- силуэты: папа, мама и двое детей -->
  <g fill="#0b111e">
    <circle cx="104" cy="288" r="27"/>
    <path d="M62 400c0-27 19-47 42-47s42 20 42 47z"/>
    <circle cx="196" cy="298" r="21"/>
    <path d="M164 400c0-21 14-37 32-37s32 16 32 37z"/>
    <circle cx="264" cy="306" r="17"/>
    <path d="M238 400c0-17 12-30 26-30s26 13 26 30z"/>
    <circle cx="324" cy="292" r="24"/>
    <path d="M288 400c0-24 16-42 36-42s36 18 36 42z"/>
  </g>
  <g fill="#7fb0f0" opacity="0.35">
    <path d="M77 288a27 27 0 0 1 27-27v54a27 27 0 0 1-27-27Z"/>
    <path d="M175 298a21 21 0 0 1 21-21v42a21 21 0 0 1-21-21Z"/>
    <path d="M247 306a17 17 0 0 1 17-17v34a17 17 0 0 1-17-17Z"/>
    <path d="M300 292a24 24 0 0 1 24-24v48a24 24 0 0 1-24-24Z"/>
  </g>

  <!-- ведро попкорна -->
  <path d="M150 352h44l-5 48h-34z" fill="#e2504a"/>
  <path d="M150 352h44l-1.5 13h-41z" fill="#f8f4ea"/>
  <g fill="#f9e9b0">
    <circle cx="158" cy="348" r="7.5"/><circle cx="171" cy="341" r="8.5"/>
    <circle cx="184" cy="348" r="7"/><circle cx="192" cy="344" r="5.5"/>
  </g>
</svg>
