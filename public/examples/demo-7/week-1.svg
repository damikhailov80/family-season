<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Комната, украшенная к Хеллоуину</title>

  <!-- Комната вечером -->
  <rect width="200" height="200" fill="#1d2a3a"/>
  <rect y="150" width="200" height="50" fill="#16202c"/>
  <path d="M0 150 L200 150" stroke="#0d1620" stroke-width="2"/>

  <!-- Окно с луной -->
  <rect x="120" y="24" width="62" height="66" rx="2" fill="#2b3d52"/>
  <rect x="124" y="28" width="54" height="58" fill="#3d5570"/>
  <circle cx="163" cy="45" r="11" fill="#e6df44"/>
  <circle cx="158" cy="42" r="2.4" fill="#d3cc3a" opacity=".7"/>
  <circle cx="166" cy="50" r="1.8" fill="#d3cc3a" opacity=".7"/>
  <g stroke="#2b3d52" stroke-width="3">
    <path d="M151 28 L151 86"/>
    <path d="M124 57 L178 57"/>
  </g>

  <!-- Паутина в углу -->
  <g stroke="#8fa3b8" stroke-width="1.4" fill="none" opacity=".85">
    <path d="M0 6 L52 6M0 6 L0 58M0 6 L44 50"/>
    <path d="M0 20 Q13 15 18 6"/>
    <path d="M0 34 Q24 26 32 6"/>
    <path d="M0 48 Q36 37 46 6"/>
  </g>
  <circle cx="22" cy="24" r="4" fill="#0d1620"/>
  <g stroke="#0d1620" stroke-width="1.4">
    <path d="M18 21 L13 17M18 27 L13 30M26 21 L31 17M26 27 L31 30"/>
  </g>

  <!-- Гирлянда с летучими мышами -->
  <path d="M6 68 Q56 96 112 66" fill="none" stroke="#f0810f" stroke-width="2"/>
  <g fill="#0d1620">
    <path d="M28 82 l6 -4 4 5 4 -5 6 4 -5 3 -5 5 -5 -5 z"/>
    <path d="M64 92 l6 -4 4 5 4 -5 6 4 -5 3 -5 5 -5 -5 z"/>
    <path d="M96 82 l6 -4 4 5 4 -5 6 4 -5 3 -5 5 -5 -5 z"/>
  </g>

  <!-- Стол -->
  <rect x="30" y="146" width="118" height="6" rx="2" fill="#5a4632"/>
  <rect x="44" y="152" width="6" height="30" fill="#4a3a29"/>
  <rect x="128" y="152" width="6" height="30" fill="#4a3a29"/>

  <!-- Тыква-фонарь -->
  <g transform="translate(78 122)">
    <path d="M0 -22 q3 -6 9 -7 -5 3 -5 8 z" fill="#4e7a2a"/>
    <ellipse cx="0" cy="0" rx="26" ry="23" fill="#f0810f"/>
    <ellipse cx="-14" cy="0" rx="9" ry="22" fill="#d9700a" opacity=".55"/>
    <ellipse cx="14" cy="0" rx="9" ry="22" fill="#d9700a" opacity=".55"/>
    <path d="M-15 -8 l9 6 -9 4 z" fill="#1d2a3a"/>
    <path d="M15 -8 l-9 6 9 4 z" fill="#1d2a3a"/>
    <path d="M-13 8 l5 4 4 -3 4 4 4 -4 4 3 4 -4 -2 7 h-25 z" fill="#1d2a3a"/>
  </g>

  <!-- Свеча -->
  <g transform="translate(126 128)">
    <rect x="-6" y="0" width="12" height="18" rx="2" fill="#e8e2d2"/>
    <path d="M0 -9 q5 5 0 9 q-5 -4 0 -9 z" fill="#e6df44"/>
  </g>
</svg>
