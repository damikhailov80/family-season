<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Вечер у экрана, всей семьёй под пледом</title>

  <!-- Тёмная гостиная -->
  <rect width="200" height="200" fill="#16202c"/>

  <!-- Свет от экрана -->
  <path d="M100 62 L200 8 L200 170 L0 170 L0 8 Z" fill="#22384f" opacity=".55"/>

  <!-- Телевизор -->
  <rect x="42" y="18" width="116" height="70" rx="4" fill="#0d1620"/>
  <rect x="48" y="24" width="104" height="58" fill="#3d5570"/>
  <circle cx="86" cy="48" r="13" fill="#22384f"/>
  <path d="M86 61 q-16 3 -20 21 h40 q-4 -18 -20 -21 z" fill="#22384f"/>
  <path d="M118 30 l24 0 -24 52 z" fill="#e6df44" opacity=".3"/>
  <rect x="92" y="88" width="16" height="8" fill="#0d1620"/>
  <rect x="78" y="96" width="44" height="5" rx="2" fill="#0d1620"/>

  <!-- Диван -->
  <path d="M14 170 L14 128 q0 -10 10 -10 L176 118 q10 0 10 10 L186 170 Z" fill="#2b3d52"/>
  <path d="M26 170 L26 134 q0 -6 6 -6 L168 128 q6 0 6 6 L174 170 Z" fill="#35506c"/>

  <!-- Плед -->
  <path d="M40 170 q30 -18 62 -14 q34 4 58 14 z" fill="#f0810f"/>
  <g stroke="#d9700a" stroke-width="2">
    <path d="M62 158 L70 170"/>
    <path d="M92 154 L96 170"/>
    <path d="M124 156 L124 170"/>
  </g>

  <!-- Головы зрителей -->
  <circle cx="58" cy="142" r="13" fill="#0d1620"/>
  <circle cx="88" cy="136" r="10" fill="#0d1620"/>
  <circle cx="114" cy="140" r="11" fill="#0d1620"/>
  <circle cx="142" cy="137" r="12" fill="#0d1620"/>
  <path d="M130 128 q12 -10 24 0" fill="#0d1620"/>

  <!-- Миска попкорна -->
  <g transform="translate(172 156)">
    <circle cx="-4" cy="-12" r="4" fill="#f3e9d6"/>
    <circle cx="3" cy="-15" r="4.5" fill="#efe3cc"/>
    <circle cx="9" cy="-11" r="4" fill="#f3e9d6"/>
    <path d="M-12 -10 L14 -10 L10 6 L-8 6 Z" fill="#e6df44"/>
  </g>
</svg>
