<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Массаж: записались оба в один день</title>

  <rect width="200" height="200" fill="#e7eee6"/>
  <rect y="128" width="200" height="72" fill="#d5e0d2"/>

  <!-- Две кушетки рядом -->
  <g>
    <rect x="14" y="74" width="78" height="26" rx="6" fill="#f5f8f3"/>
    <rect x="14" y="74" width="78" height="8" rx="4" fill="#a1be95"/>
    <rect x="22" y="100" width="8" height="30" fill="#8fa3b8"/>
    <rect x="76" y="100" width="8" height="30" fill="#8fa3b8"/>
    <circle cx="28" cy="66" r="10" fill="#e2dfa2"/>
  </g>
  <g>
    <rect x="108" y="96" width="78" height="26" rx="6" fill="#f5f8f3"/>
    <rect x="108" y="96" width="78" height="8" rx="4" fill="#ed5752"/>
    <rect x="116" y="122" width="8" height="30" fill="#8fa3b8"/>
    <rect x="170" y="122" width="8" height="30" fill="#8fa3b8"/>
    <circle cx="122" cy="88" r="10" fill="#e2dfa2"/>
  </g>

  <!-- Свеча и масло -->
  <g transform="translate(100 168)">
    <rect x="-12" y="-14" width="24" height="24" rx="3" fill="#f5f8f3"/>
    <path d="M0 -14 q4 -8 0 -12 q-4 4 0 12" fill="#ed5752"/>
  </g>
  <g transform="translate(150 172)">
    <rect x="-9" y="-18" width="18" height="26" rx="3" fill="#a1be95"/>
    <rect x="-4" y="-24" width="8" height="8" rx="2" fill="#8fa3b8"/>
  </g>

  <!-- Полотенца свёрнуты -->
  <g transform="translate(42 168)">
    <rect x="-20" y="-8" width="40" height="16" rx="8" fill="#f5f8f3"/>
    <circle cx="20" cy="0" r="8" fill="#e6eef5"/>
    <circle cx="20" cy="0" r="3" fill="#c9d6e4"/>
  </g>
</svg>
