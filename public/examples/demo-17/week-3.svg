<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Спа на весь день, телефоны в шкафчике</title>

  <rect width="200" height="200" fill="#dff0f3"/>

  <!-- Бассейн -->
  <rect x="0" y="86" width="200" height="114" fill="#9ecfe0"/>
  <g stroke="#c9e6ef" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M8 108 q14 -8 28 0 q14 8 28 0 q14 -8 28 0 q14 8 28 0 q14 -8 28 0 q14 8 28 0"/>
    <path d="M8 140 q14 -8 28 0 q14 8 28 0 q14 -8 28 0 q14 8 28 0 q14 -8 28 0 q14 8 28 0"/>
    <path d="M8 172 q14 -8 28 0 q14 8 28 0 q14 -8 28 0 q14 8 28 0 q14 -8 28 0 q14 8 28 0"/>
  </g>
  <rect x="0" y="80" width="200" height="8" fill="#e6eef5"/>

  <!-- Шкафчик с телефонами -->
  <g transform="translate(46 42)">
    <rect x="-40" y="-32" width="80" height="66" rx="4" fill="#8fa3b8"/>
    <rect x="-36" y="-28" width="34" height="26" rx="2" fill="#e6eef5"/>
    <rect x="2" y="-28" width="34" height="26" rx="2" fill="#e6eef5"/>
    <rect x="-36" y="2" width="72" height="28" rx="2" fill="#dfe7ee"/>
    <g fill="#5b6d7e">
      <rect x="-28" y="-24" width="18" height="18" rx="2"/>
      <rect x="10" y="-24" width="18" height="18" rx="2"/>
    </g>
    <circle cx="-2" cy="16" r="3" fill="#5b6d7e"/>
  </g>

  <!-- Халаты на крючках -->
  <g transform="translate(150 44)">
    <path d="M-30 -34 L30 -34" stroke="#8fa3b8" stroke-width="4"/>
    <g fill="#f5f8f3">
      <path d="M-24 -30 L-6 -30 L-2 6 L-28 6 Z"/>
      <path d="M4 -30 L22 -30 L26 6 L0 6 Z"/>
    </g>
    <g stroke="#c9d6e4" stroke-width="2">
      <path d="M-15 -30 L-15 6"/>
      <path d="M13 -30 L13 6"/>
    </g>
