<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Коридор поликлиники: дошли до врача</title>

  <rect width="200" height="200" fill="#eef1ea"/>
  <rect y="0" width="200" height="96" fill="#e3e9e0"/>
  <path d="M0 96 L200 96" stroke="#c3ccc2" stroke-width="2"/>
  <g stroke="#dfe4dd" stroke-width="2">
    <path d="M0 130 L200 130"/><path d="M0 164 L200 164"/>
  </g>

  <!-- Дверь кабинета с номером -->
  <g transform="translate(150 46)">
    <rect x="-34" y="-40" width="68" height="96" rx="3" fill="#c9d6e4"/>
    <rect x="-28" y="-34" width="56" height="40" rx="2" fill="#e6eef5"/>
    <circle cx="-20" cy="24" r="4" fill="#8fa3b8"/>
    <rect x="-14" y="-52" width="28" height="12" rx="2" fill="#f5f8f3"/>
    <path d="M-6 -46 L6 -46" stroke="#5b6d7e" stroke-width="3"/>
  </g>

  <!-- Ряд стульев, один занят курткой -->
  <g fill="#8fa3b8">
    <rect x="10" y="104" width="34" height="8" rx="3"/>
    <rect x="12" y="112" width="6" height="22"/>
    <rect x="36" y="112" width="6" height="22"/>
    <rect x="52" y="104" width="34" height="8" rx="3"/>
    <rect x="54" y="112" width="6" height="22"/>
    <rect x="78" y="112" width="6" height="22"/>
  </g>
  <path d="M56 104 q14 -22 28 0 z" fill="#ed5752"/>

  <!-- Талончик в руке и направление -->
  <g transform="translate(44 168) rotate(-6)">
    <rect x="-28" y="-18" width="56" height="36" rx="2" fill="#f5f8f3"/>
    <g stroke="#a9b4a4" stroke-width="2.4" stroke-linecap="round">
      <path d="M-18 -8 L14 -8"/>
      <path d="M-18 0 L6 0"/>
      <path d="M-18 8 L10 8"/>
    </g>
  </g>
  <g transform="translate(128 172)">
    <rect x="-22" y="-12" width="44" height="24" rx="3" fill="#a1be95"/>
    <path d="M-8 0 L8 0 M0 -8 L0 8" stroke="#f5f8f3" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
