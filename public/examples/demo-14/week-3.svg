<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Полка для обмена книгами в подъезде</title>

  <!-- Стена подъезда: панель снизу, побелка сверху -->
  <rect width="200" height="200" fill="#e6e2d6"/>
  <rect y="132" width="200" height="68" fill="#b9bfa8"/>
  <rect y="130" width="200" height="4" fill="#8f9880"/>

  <!-- Полка из старых досок -->
  <g>
    <rect x="26" y="60" width="148" height="8" rx="2" fill="#a37f4e"/>
    <rect x="26" y="112" width="148" height="8" rx="2" fill="#a37f4e"/>
    <rect x="26" y="44" width="8" height="76" fill="#8a6a3a"/>
    <rect x="166" y="44" width="8" height="76" fill="#8a6a3a"/>
  </g>

  <!-- Верхний ряд книг, уже разобранный -->
  <g>
    <rect x="38" y="42" width="10" height="18" fill="#6c2d2c"/>
    <rect x="50" y="42" width="8" height="18" fill="#42313a"/>
    <rect x="60" y="42" width="11" height="18" fill="#9f4636"/>
    <rect x="73" y="44" width="9" height="16" fill="#42313a"/>
    <rect x="86" y="42" width="7" height="18" fill="#6c2d2c"/>
    <!-- дальше пусто: соседи разобрали -->
    <rect x="140" y="46" width="24" height="14" rx="1" fill="#9f4636" transform="rotate(-4 152 53)"/>
  </g>

  <!-- Нижний ряд: принесли своё -->
  <g>
    <rect x="38" y="92" width="9" height="20" fill="#42313a"/>
    <rect x="49" y="94" width="11" height="18" fill="#9f4636"/>
    <rect x="62" y="92" width="8" height="20" fill="#6c2d2c"/>
    <rect x="72" y="96" width="10" height="16" fill="#42313a"/>
    <rect x="84" y="92" width="7" height="20" fill="#9f4636"/>
    <rect x="93" y="94" width="12" height="18" fill="#6c2d2c"/>
    <rect x="107" y="92" width="9" height="20" fill="#42313a"/>
    <rect x="118" y="96" width="8" height="16" fill="#9f4636"/>
    <rect x="128" y="92" width="11" height="20" fill="#6c2d2c"/>
    <rect x="141" y="94" width="9" height="18" fill="#42313a"/>
    <rect x="152" y="92" width="10" height="20" fill="#9f4636"/>
  </g>

  <!-- Записка на стене -->
  <g transform="translate(100 26) rotate(-3)">
    <rect x="-52" y="-16" width="104" height="32" rx="2" fill="#f5efe2"/>
    <g stroke="#8a8172" stroke-width="2.6" stroke-linecap="round">
      <path d="M-40 -4 L26 -4"/>
      <path d="M-40 7 L8 7"/>
    </g>
  </g>

  <!-- Стопка на полу, ждёт своей очереди -->
  <g transform="translate(48 168)">
    <rect x="-24" y="-6" width="48" height="10" rx="2" fill="#6c2d2c"/>
    <rect x="-21" y="-15" width="42" height="9" rx="2" fill="#9f4636"/>
    <rect x="-18" y="-23" width="36" height="8" rx="2" fill="#42313a"/>
  </g>
</svg>
