<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Гитара и пианино в одной комнате</title>

  <!-- Комната -->
  <rect width="200" height="200" fill="#efe6d6"/>
  <rect y="150" width="200" height="50" fill="#d9c9ad"/>
  <path d="M0 150 L200 150" stroke="#c0ab88" stroke-width="2"/>

  <!-- Пианино -->
  <g transform="translate(126 150)">
    <rect x="-58" y="-92" width="116" height="60" rx="3" fill="#4a3128"/>
    <rect x="-52" y="-86" width="104" height="34" rx="2" fill="#5d4033"/>
    <rect x="-62" y="-34" width="124" height="12" rx="2" fill="#3a2620"/>
    <!-- Клавиши -->
    <rect x="-54" y="-22" width="108" height="18" fill="#f6f1e6"/>
    <g stroke="#c9bda6" stroke-width="1.2">
      <path d="M-42 -22 L-42 -4"/><path d="M-30 -22 L-30 -4"/><path d="M-18 -22 L-18 -4"/>
      <path d="M-6 -22 L-6 -4"/><path d="M6 -22 L6 -4"/><path d="M18 -22 L18 -4"/>
      <path d="M30 -22 L30 -4"/><path d="M42 -22 L42 -4"/>
    </g>
    <g fill="#2a2528">
      <rect x="-47" y="-22" width="5" height="11"/>
      <rect x="-35" y="-22" width="5" height="11"/>
      <rect x="-23" y="-22" width="5" height="11"/>
      <rect x="-1" y="-22" width="5" height="11"/>
      <rect x="11" y="-22" width="5" height="11"/>
      <rect x="35" y="-22" width="5" height="11"/>
    </g>
    <rect x="-54" y="-4" width="108" height="4" fill="#3a2620"/>
  </g>

  <!-- Ноты на пюпитре -->
  <g transform="translate(112 66)">
    <rect x="-14" y="-14" width="28" height="22" rx="1.5" fill="#f6f1e6"/>
    <g stroke="#8a7d66" stroke-width="1">
      <path d="M-10 -9 L10 -9"/><path d="M-10 -5 L10 -5"/><path d="M-10 -1 L10 -1"/><path d="M-10 3 L10 3"/>
    </g>
  </g>

  <!-- Гитара -->
  <g transform="translate(52 116) rotate(-12)">
    <path d="M0 -20 C-20 -20 -26 -4 -26 8 C-26 22 -16 34 0 34 C16 34 26 22 26 8 C26 -4 20 -20 0 -20 Z" fill="#c29545"/>
    <path d="M0 -20 C-14 -20 -19 -10 -19 -2 C-19 6 -12 12 0 12 C12 12 19 6 19 -2 C19 -10 14 -20 0 -20 Z" fill="#d8b06a"/>
    <circle cx="0" cy="0" r="7.5" fill="#5d4033"/>
    <rect x="-3.5" y="-70" width="7" height="52" rx="2" fill="#5d4033"/>
    <rect x="-6" y="-80" width="12" height="12" rx="2" fill="#4a3128"/>
    <g stroke="#8a7d66" stroke-width="0.8">
      <path d="M-2 -68 L-2 22"/>
      <path d="M0 -68 L0 22"/>
      <path d="M2 -68 L2 22"/>
    </g>
    <rect x="-8" y="18" width="16" height="4" rx="1" fill="#4a3128"/>
  </g>

  <!-- Табурет -->
  <g transform="translate(96 172)">
    <rect x="-16" y="-10" width="32" height="6" rx="2" fill="#5d4033"/>
    <rect x="-13" y="-4" width="4" height="14" fill="#4a3128"/>
    <rect x="9" y="-4" width="4" height="14" fill="#4a3128"/>
  </g>
</svg>
