  <!-- Резной верх -->
  <path d="M18 44 q40 -18 82 -12 q42 6 82 12 L182 34 L18 34 Z" fill="#6b4a35"/>
  <g fill="#c9a86a">
    <circle cx="100" cy="26" r="6"/>
    <circle cx="62" cy="30" r="3.5"/>
    <circle cx="138" cy="30" r="3.5"/>
  </g>

  <!-- Зрители в темноте -->
  <g fill="#171310">
    <rect y="176" width="200" height="24"/>
    <circle cx="34" cy="178" r="11"/>
    <circle cx="76" cy="174" r="10"/>
    <circle cx="118" cy="179" r="11"/>
