<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Орган в концертном зале</title>

  <!-- Зал -->
  <rect width="200" height="200" fill="#2e2620"/>
  <rect y="150" width="200" height="50" fill="#241f1a"/>

  <!-- Корпус органа -->
  <path d="M18 150 L18 42 q0 -8 8 -8 L174 34 q8 0 8 8 L182 150 Z" fill="#5a3d2c"/>
  <path d="M26 150 L26 46 L174 46 L174 150 Z" fill="#3f2a1e"/>

  <!-- Трубы -->
  <g fill="#c9a86a">
    <rect x="32" y="74" width="12" height="76" rx="6"/>
    <rect x="48" y="62" width="12" height="88" rx="6"/>
    <rect x="64" y="52" width="12" height="98" rx="6"/>
    <rect x="80" y="60" width="12" height="90" rx="6"/>
    <rect x="96" y="50" width="12" height="100" rx="6"/>
    <rect x="112" y="60" width="12" height="90" rx="6"/>
    <rect x="128" y="52" width="12" height="98" rx="6"/>
    <rect x="144" y="62" width="12" height="88" rx="6"/>
    <rect x="160" y="74" width="12" height="76" rx="6"/>
  </g>
  <g fill="#e3c98f">
    <rect x="34" y="74" width="4" height="76" rx="2"/>
    <rect x="50" y="62" width="4" height="88" rx="2"/>
    <rect x="66" y="52" width="4" height="98" rx="2"/>
    <rect x="82" y="60" width="4" height="90" rx="2"/>
    <rect x="98" y="50" width="4" height="100" rx="2"/>
    <rect x="114" y="60" width="4" height="90" rx="2"/>
    <rect x="130" y="52" width="4" height="98" rx="2"/>
    <rect x="146" y="62" width="4" height="88" rx="2"/>
    <rect x="162" y="74" width="4" height="76" rx="2"/>
