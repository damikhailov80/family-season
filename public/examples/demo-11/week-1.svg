<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Чиним то, что давно раздражает</title>

  <!-- Комната -->
  <rect width="200" height="200" fill="#efe3d3"/>
  <rect y="152" width="200" height="48" fill="#d8c4ad"/>
  <path d="M0 152 L200 152" stroke="#bda389" stroke-width="2"/>

  <!-- Шкаф с перекошенной дверцей -->
  <g>
    <rect x="20" y="34" width="92" height="118" fill="#8a6a52"/>
    <rect x="26" y="40" width="80" height="106" fill="#a5836a"/>
    <!-- Левая дверца на месте -->
    <rect x="28" y="42" width="37" height="102" rx="2" fill="#b6452c"/>
    <circle cx="60" cy="94" r="3" fill="#efe3d3"/>
    <!-- Правая, снятая с петли -->
    <g transform="translate(88 44) rotate(7)">
      <rect x="-20" y="0" width="37" height="102" rx="2" fill="#c0563d"/>
      <circle cx="-13" cy="50" r="3" fill="#efe3d3"/>
    </g>
    <!-- Петля -->
    <g fill="#8e8c86">
      <rect x="64" y="60" width="10" height="14" rx="2"/>
      <rect x="64" y="112" width="10" height="14" rx="2"/>
    </g>
  </g>

  <!-- Стремянка -->
  <g transform="translate(150 152)">
    <g stroke="#c9a86a" stroke-width="6" stroke-linecap="round">
      <path d="M-16 0 L-6 -76"/>
      <path d="M16 0 L6 -76"/>
    </g>
    <g stroke="#a5844b" stroke-width="5" stroke-linecap="round">
      <path d="M-13 -22 L13 -22"/>
      <path d="M-11 -44 L11 -44"/>
      <path d="M-8 -64 L8 -64"/>
    </g>
  </g>

  <!-- Ящик с инструментами -->
  <g transform="translate(60 176)">
    <path d="M-34 -20 L34 -20 L30 6 L-30 6 Z" fill="#523634"/>
    <rect x="-34" y="-24" width="68" height="6" rx="2" fill="#3f2926"/>
    <path d="M-14 -24 q14 -16 28 0" fill="none" stroke="#8e8c86" stroke-width="4"/>
    <!-- Отвёртка и ключ торчат -->
    <g transform="translate(-18 -34) rotate(-14)">
      <rect x="-2" y="0" width="4" height="18" fill="#b6452c"/>
      <rect x="-1.2" y="14" width="2.4" height="14" fill="#9aa7ad"/>
    </g>
    <g transform="translate(16 -32) rotate(12)">
      <rect x="-2.5" y="2" width="5" height="20" rx="2" fill="#9aa7ad"/>
      <path d="M-5 2 L5 2 L3 -6 L-3 -6 Z" fill="#9aa7ad"/>
    </g>
  </g>

  <!-- Молоток на полу -->
  <g transform="translate(122 186) rotate(-6)">
    <rect x="-2" y="-2" width="30" height="5" rx="2" fill="#c9a86a"/>
    <path d="M-14 -7 L0 -7 L0 8 L-14 8 Z" fill="#6b6864"/>
    <path d="M-18 -4 L-14 -7 L-14 8 L-18 5 Z" fill="#585552"/>
  </g>
</svg>
