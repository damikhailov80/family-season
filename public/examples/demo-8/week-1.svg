<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Музей, в котором мы не были</title>

  <!-- Небо и площадь -->
  <rect width="200" height="200" fill="#bcd0dd"/>
  <rect y="150" width="200" height="50" fill="#9aa8ad"/>
  <path d="M0 150 L200 150" stroke="#7d8b90" stroke-width="2"/>

  <!-- Здание музея -->
  <g>
    <!-- Портик -->
    <path d="M30 66 L100 34 L170 66 Z" fill="#763626"/>
    <path d="M30 66 L170 66 L170 74 L30 74 Z" fill="#8a4531"/>
    <path d="M100 44 L100 44" fill="none"/>
    <circle cx="100" cy="55" r="6" fill="#e2c499"/>

    <!-- Стена -->
    <rect x="38" y="74" width="124" height="66" fill="#e2c499"/>

    <!-- Колонны -->
    <g fill="#f1e2c8">
      <rect x="46" y="76" width="12" height="62"/>
      <rect x="70" y="76" width="12" height="62"/>
      <rect x="94" y="76" width="12" height="62"/>
      <rect x="118" y="76" width="12" height="62"/>
      <rect x="142" y="76" width="12" height="62"/>
    </g>
    <g fill="#cbb18a">
      <rect x="44" y="74" width="16" height="5"/>
      <rect x="68" y="74" width="16" height="5"/>
      <rect x="92" y="74" width="16" height="5"/>
      <rect x="116" y="74" width="16" height="5"/>
      <rect x="140" y="74" width="16" height="5"/>
      <rect x="44" y="134" width="16" height="5"/>
      <rect x="68" y="134" width="16" height="5"/>
      <rect x="92" y="134" width="16" height="5"/>
      <rect x="116" y="134" width="16" height="5"/>
      <rect x="140" y="134" width="16" height="5"/>
    </g>

    <!-- Дверь в глубине -->
    <rect x="88" y="104" width="24" height="36" rx="2" fill="#336b87"/>
    <path d="M100 104 L100 140" stroke="#2a3132" stroke-width="1.4"/>

    <!-- Ступени -->
    <rect x="30" y="140" width="140" height="5" fill="#cbb18a"/>
    <rect x="24" y="145" width="152" height="5" fill="#bda37c"/>
  </g>

  <!-- Афиша у входа -->
  <g transform="translate(176 132)">
    <rect x="-9" y="0" width="18" height="24" rx="2" fill="#336b87"/>
    <g stroke="#e2c499" stroke-width="1.6">
      <path d="M-5 7 L5 7"/>
      <path d="M-5 12 L5 12"/>
      <path d="M-5 17 L1 17"/>
    </g>
    <rect x="-1.5" y="24" width="3" height="12" fill="#2a3132"/>
  </g>

  <!-- Дерево -->
  <g transform="translate(16 150)">
    <rect x="-3" y="-26" width="6" height="26" fill="#5e4630"/>
    <circle cx="0" cy="-36" r="15" fill="#b06a26"/>
    <circle cx="-10" cy="-28" r="9" fill="#8a4531"/>
    <circle cx="10" cy="-29" r="8" fill="#c98a3a"/>
  </g>

  <!-- Трое на площади -->
  <g fill="#2a3132">
    <circle cx="72" cy="164" r="5"/>
    <path d="M67 172 q5 -5 10 0 l-2 16 h-6 z"/>
    <circle cx="88" cy="166" r="4.5"/>
    <path d="M83.5 173 q4.5 -4 9 0 l-1.5 15 h-6 z"/>
    <circle cx="101" cy="170" r="3.5"/>
    <path d="M97.5 176 q3.5 -3 7 0 l-1 12 h-5 z"/>
  </g>
</svg>
