<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Семейные открытки родственникам</title>

  <!-- Стол -->
  <rect width="200" height="200" fill="#e9dfd0"/>
  <g stroke="#d8cab6" stroke-width="2">
    <path d="M0 44 L200 44"/>
    <path d="M0 120 L200 120"/>
    <path d="M0 182 L200 182"/>
  </g>

  <!-- Готовая стопка справа -->
  <g transform="translate(150 66) rotate(8)">
    <rect x="-30" y="-22" width="60" height="44" rx="3" fill="#f6efe0"/>
    <rect x="-32" y="-26" width="60" height="44" rx="3" fill="#fdf8ef"/>
    <path d="M-32 -26 L-2 2 L28 -26" fill="none" stroke="#c8bda9" stroke-width="2"/>
  </g>

  <!-- Открытка, которую подписывают -->
  <g transform="translate(84 122) rotate(-5)">
    <rect x="-46" y="-58" width="92" height="116" rx="4" fill="#fdf8ef"/>
    <rect x="-46" y="-58" width="92" height="116" rx="4" fill="none" stroke="#e0d5c0" stroke-width="2"/>
    <!-- Ёлка на открытке -->
    <path d="M0 -44 L18 -8 L-18 -8 Z" fill="#3f6c45"/>
    <path d="M0 -30 L24 6 L-24 6 Z" fill="#4a7c4f"/>
    <rect x="-4" y="6" width="8" height="10" fill="#8a6a3a"/>
    <g fill="#cb0000">
      <circle cx="-8" cy="-12" r="3"/>
      <circle cx="9" cy="-2" r="3"/>
      <circle cx="-12" cy="2" r="3"/>
    </g>
    <path d="M0 -50 l3 6 6 1 -5 5 1 6 -5 -3 -5 3 1 -6 -5 -5 6 -1 Z" fill="#e4ea8c"/>
    <!-- Подпись от руки -->
    <g stroke="#8a8172" stroke-width="2.2" stroke-linecap="round">
      <path d="M-30 30 L18 30"/>
      <path d="M-30 42 L2 42"/>
    </g>
  </g>

  <!-- Краски и кисть -->
  <g transform="translate(26 152)">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="#9aa7ad"/>
    <g>
      <circle cx="-9" cy="-5" r="5" fill="#cb0000"/>
      <circle cx="4" cy="-5" r="5" fill="#3f6c45"/>
      <circle cx="-9" cy="6" r="5" fill="#e4ea8c"/>
      <circle cx="4" cy="6" r="5" fill="#50312f"/>
    </g>
  </g>
  <g transform="translate(56 186) rotate(-40)">
    <rect x="-2.5" y="-40" width="5" height="52" rx="2" fill="#c9a06a"/>
    <rect x="-3" y="8" width="6" height="8" fill="#9aa7ad"/>
    <path d="M-3 16 L3 16 L0 28 Z" fill="#cb0000"/>
  </g>

  <!-- Конверты -->
  <g transform="translate(168 158) rotate(-10)">
    <rect x="-26" y="-17" width="52" height="34" rx="2" fill="#e4ea8c"/>
    <path d="M-26 -17 L0 4 L26 -17" fill="none" stroke="#c3c96f" stroke-width="2"/>
  </g>
</svg>
