<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Столик на двоих в итальянском ресторане</title>

  <!-- Зал -->
  <rect width="200" height="200" fill="#3a2f42"/>
  <rect y="120" width="200" height="80" fill="#332941"/>

  <!-- Окно с вечерним светом -->
  <rect x="18" y="18" width="60" height="52" rx="3" fill="#5a4a66"/>
  <rect x="23" y="23" width="50" height="42" fill="#f2c057" opacity=".35"/>
  <g stroke="#5a4a66" stroke-width="3">
    <path d="M48 23 L48 65"/>
    <path d="M23 44 L73 44"/>
  </g>

  <!-- Гирлянда лампочек -->
  <path d="M84 16 Q140 40 196 14" fill="none" stroke="#7a6a86" stroke-width="1.6"/>
  <g fill="#f2c057">
    <circle cx="104" cy="27" r="4"/>
    <circle cx="130" cy="34" r="4"/>
    <circle cx="156" cy="33" r="4"/>
    <circle cx="180" cy="25" r="4"/>
  </g>

  <!-- Стол -->
  <ellipse cx="100" cy="140" rx="80" ry="26" fill="#f6f1e6"/>
  <path d="M20 140 q0 26 80 26 q80 0 80 -26 L180 140 Z" fill="#e4dbc9"/>
  <!-- Клетчатая скатерть -->
  <g stroke="#d13525" stroke-width="2" opacity=".7">
    <path d="M44 128 q4 30 12 36"/>
    <path d="M72 122 q1 34 4 42"/>
    <path d="M100 120 L100 166"/>
    <path d="M128 122 q-1 34 -4 42"/>
    <path d="M156 128 q-4 30 -12 36"/>
    <path d="M26 148 q74 16 148 0"/>
    <path d="M22 138 q78 14 156 0"/>
  </g>

  <!-- Свеча в бутылке -->
  <g transform="translate(100 124)">
    <path d="M-6 0 L-6 -18 q0 -6 -3 -10 L-9 -34 h18 L9 -28 q-3 4 -3 10 L6 0 Z" fill="#486824"/>
    <rect x="-9" y="-38" width="18" height="6" rx="2" fill="#3a5a1c"/>
    <path d="M0 -50 q6 6 0 12 q-6 -6 0 -12 Z" fill="#f2c057"/>
  </g>

  <!-- Тарелки и бокалы -->
  <g>
    <ellipse cx="58" cy="146" rx="22" ry="8" fill="#ffffff"/>
    <ellipse cx="58" cy="145" rx="14" ry="5" fill="#f0e7d6"/>
    <ellipse cx="142" cy="146" rx="22" ry="8" fill="#ffffff"/>
    <ellipse cx="142" cy="145" rx="14" ry="5" fill="#f0e7d6"/>
  </g>
  <g transform="translate(32 132)">
    <path d="M-7 -20 L7 -20 L3 -8 L-3 -8 Z" fill="#d13525" opacity=".85"/>
    <rect x="-1" y="-8" width="2" height="8" fill="#cfc7b6"/>
    <ellipse cx="0" cy="0" rx="6" ry="2.5" fill="#cfc7b6"/>
  </g>
  <g transform="translate(168 132)">
    <path d="M-7 -20 L7 -20 L3 -8 L-3 -8 Z" fill="#d13525" opacity=".85"/>
    <rect x="-1" y="-8" width="2" height="8" fill="#cfc7b6"/>
    <ellipse cx="0" cy="0" rx="6" ry="2.5" fill="#cfc7b6"/>
  </g>

  <!-- Стулья -->
  <g fill="#2a2233">
    <rect x="16" y="168" width="34" height="8" rx="3"/>
    <rect x="150" y="168" width="34" height="8" rx="3"/>
  </g>
</svg>
