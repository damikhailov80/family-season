<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Мастер-класс: паста под присмотром</title>

  <!-- Кухня -->
  <rect width="200" height="200" fill="#e8d9bf"/>
  <rect width="200" height="86" fill="#dcc9a8"/>

  <!-- Полка с банками -->
  <rect x="12" y="18" width="176" height="5" rx="2" fill="#a5844b"/>
  <g>
    <rect x="24" y="-2" width="18" height="20" rx="2" fill="#d13525"/>
    <rect x="50" y="2" width="16" height="16" rx="2" fill="#486824"/>
    <rect x="74" y="-4" width="18" height="22" rx="2" fill="#f2c057"/>
    <rect x="140" y="0" width="16" height="18" rx="2" fill="#d13525"/>
    <rect x="162" y="4" width="16" height="14" rx="2" fill="#486824"/>
  </g>

  <!-- Шеф -->
  <g transform="translate(148 86)">
    <path d="M-20 -22 q0 -14 20 -14 q20 0 20 14 q0 6 -6 8 L-14 -14 Z" fill="#f6f1e6" stroke="#c9b696" stroke-width="1.4"/>
    <rect x="-16" y="-16" width="32" height="8" rx="2" fill="#efe6d6"/>
    <circle cx="0" cy="0" r="13" fill="#e8c39a"/>
    <path d="M-6 2 q6 5 12 0" fill="none" stroke="#8a5a3b" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="-5" cy="-3" r="1.6" fill="#4c3f54"/>
    <circle cx="5" cy="-3" r="1.6" fill="#4c3f54"/>
    <path d="M-22 46 q0 -32 22 -32 q22 0 22 32 Z" fill="#f6f1e6" stroke="#c9b696" stroke-width="1.4"/>
    <path d="M0 14 L0 46" stroke="#dcd2bf" stroke-width="1.6"/>
  </g>

  <!-- Стол -->
  <rect y="130" width="200" height="10" fill="#a5844b"/>
  <rect y="140" width="200" height="60" fill="#8a6a3a"/>

  <!-- Доска с мукой -->
  <rect x="16" y="112" width="108" height="20" rx="4" fill="#c9a86a"/>
  <ellipse cx="70" cy="112" rx="46" ry="9" fill="#f6f1e6"/>

  <!-- Тесто и лапша -->
  <ellipse cx="40" cy="108" rx="16" ry="9" fill="#f0dfc4"/>
  <g stroke="#e8c98b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M78 106 q8 12 4 26"/>
    <path d="M88 104 q9 14 5 28"/>
    <path d="M98 105 q8 13 3 27"/>
  </g>

  <!-- Шарики теста -->
  <g fill="#f0dfc4">
    <ellipse cx="34" cy="146" rx="14" ry="9"/>
    <ellipse cx="66" cy="150" rx="13" ry="8"/>
    <ellipse cx="96" cy="146" rx="11" ry="7"/>
  </g>

  <!-- Скалка -->
  <g transform="translate(150 150) rotate(-8)">
    <rect x="-30" y="-5" width="60" height="10" rx="5" fill="#c9a86a"/>
    <rect x="-42" y="-2.5" width="14" height="5" rx="2.5" fill="#8a6a3a"/>
    <rect x="28" y="-2.5" width="14" height="5" rx="2.5" fill="#8a6a3a"/>
  </g>
</svg>
