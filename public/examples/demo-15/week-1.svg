<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Одноклассники сына пришли в гости</title>

  <!-- Пол и стол сверху -->
  <rect width="200" height="200" fill="#f0e4d4"/>
  <circle cx="100" cy="104" r="82" fill="#c98b57"/>
  <circle cx="100" cy="104" r="74" fill="#e8c9a3"/>

  <!-- Пицца в центре, двух кусков нет -->
  <g transform="translate(100 104)">
    <circle r="34" fill="#eba85e"/>
    <circle r="28" fill="#d24136"/>
    <path d="M0 0 L28 -6 A28 28 0 0 1 20 20 Z" fill="#e8c9a3"/>
    <g fill="#a8352c">
      <circle cx="-14" cy="-8" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="-18" cy="6" r="4"/>
      <circle cx="-6" cy="12" r="4"/>
      <circle cx="6" cy="-14" r="4"/>
    </g>
  </g>

  <!-- Стаканы с соком по кругу -->
  <g fill="#fdf6ec" stroke="#c98b57" stroke-width="2">
    <circle cx="100" cy="48" r="11"/>
    <circle cx="152" cy="76" r="11"/>
    <circle cx="152" cy="134" r="11"/>
    <circle cx="100" cy="162" r="11"/>
    <circle cx="48" cy="134" r="11"/>
    <circle cx="48" cy="76" r="11"/>
  </g>
  <g fill="#eb8a3e">
    <circle cx="100" cy="48" r="7"/>
    <circle cx="152" cy="76" r="7"/>
    <circle cx="152" cy="134" r="7"/>
    <circle cx="48" cy="134" r="7"/>
    <circle cx="48" cy="76" r="7"/>
  </g>
  <circle cx="100" cy="162" r="7" fill="#ebb582"/>

  <!-- Стулья вокруг, один отодвинут -->
  <g fill="#785a46">
    <rect x="90" y="6" width="20" height="10" rx="2"/>
    <rect x="170" y="52" width="20" height="10" rx="2" transform="rotate(58 180 57)"/>
    <rect x="170" y="146" width="20" height="10" rx="2" transform="rotate(-58 180 151)"/>
    <rect x="86" y="188" width="20" height="10" rx="2" transform="rotate(12 96 193)"/>
    <rect x="10" y="146" width="20" height="10" rx="2" transform="rotate(58 20 151)"/>
    <rect x="10" y="52" width="20" height="10" rx="2" transform="rotate(-58 20 57)"/>
  </g>

  <!-- Фанты: бумажки в шапке -->
  <g transform="translate(36 34)">
    <path d="M-18 8 q18 -14 36 0 z" fill="#785a46"/>
    <g fill="#fdf6ec">
      <rect x="-10" y="-6" width="7" height="12" rx="1" transform="rotate(-12 -6 0)"/>
      <rect x="0" y="-9" width="7" height="12" rx="1" transform="rotate(6 3 -3)"/>
      <rect x="8" y="-5" width="7" height="12" rx="1" transform="rotate(18 11 1)"/>
    </g>
  </g>
</svg>
