<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>У бабушки с дедушкой достали альбомы</title>

  <!-- Обои и скатерть -->
  <rect width="200" height="200" fill="#e6d3b8"/>
  <g stroke="#d9c2a2" stroke-width="2">
    <path d="M24 0 L24 92"/><path d="M64 0 L64 92"/><path d="M104 0 L104 92"/>
    <path d="M144 0 L144 92"/><path d="M184 0 L184 92"/>
  </g>
  <rect y="92" width="200" height="108" fill="#fdf6ec"/>
  <path d="M0 92 L200 92" stroke="#ebb582" stroke-width="4"/>
  <g stroke="#ebb582" stroke-width="2" fill="none">
    <path d="M0 182 L200 182"/>
  </g>

  <!-- Сервант с посудой на стене -->
  <g transform="translate(150 44)">
    <rect x="-38" y="-30" width="76" height="60" rx="3" fill="#a97b4f"/>
    <rect x="-34" y="-26" width="68" height="24" fill="#e6d3b8"/>
    <rect x="-34" y="2" width="68" height="24" fill="#e6d3b8"/>
    <g fill="#fdf6ec" stroke="#c98b57" stroke-width="1.5">
      <circle cx="-22" cy="-14" r="8"/><circle cx="-4" cy="-14" r="8"/><circle cx="14" cy="-14" r="8"/>
      <rect x="-28" y="8" width="14" height="12" rx="2"/>
      <rect x="-8" y="8" width="14" height="12" rx="2"/>
      <rect x="12" y="8" width="14" height="12" rx="2"/>
    </g>
  </g>

  <!-- Альбом, раскрытый на столе -->
  <g transform="translate(74 132) rotate(-4)">
    <rect x="-52" y="-34" width="104" height="68" rx="3" fill="#785a46"/>
    <rect x="-49" y="-31" width="48" height="62" fill="#fdf6ec"/>
    <rect x="1" y="-31" width="48" height="62" fill="#fdf6ec"/>
    <path d="M0 -31 L0 31" stroke="#785a46" stroke-width="2"/>
    <g fill="#d9c2a2">
      <rect x="-42" y="-24" width="34" height="24"/>
      <rect x="-42" y="6" width="34" height="18"/>
      <rect x="8" y="-24" width="34" height="26"/>
      <rect x="8" y="8" width="20" height="16"/>
    </g>
    <g fill="#785a46" opacity="0.55">
      <circle cx="-25" cy="-16" r="5"/>
      <path d="M-33 -2 q8 -10 16 0 z"/>
      <circle cx="25" cy="-15" r="5"/>
      <path d="M17 -1 q8 -10 16 0 z"/>
    </g>
  </g>

  <!-- Чайник и варенье -->
  <g transform="translate(168 128)">
    <path d="M-20 -14 L20 -14 L16 16 L-16 16 Z" fill="#d24136"/>
    <path d="M20 -6 q12 8 0 16" fill="none" stroke="#d24136" stroke-width="5"/>
    <path d="M-20 -14 L-30 -24" stroke="#d24136" stroke-width="5" stroke-linecap="round"/>
    <rect x="-6" y="-22" width="12" height="8" rx="2" fill="#a8352c"/>
  </g>
  <g transform="translate(150 178)">
    <rect x="-14" y="-16" width="28" height="32" rx="3" fill="#a8352c"/>
    <rect x="-16" y="-22" width="32" height="8" rx="2" fill="#785a46"/>
  </g>
</svg>
