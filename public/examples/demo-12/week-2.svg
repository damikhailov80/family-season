<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Лучшая горка в районе</title>

  <!-- Небо -->
  <rect width="200" height="200" fill="#dbe4ec"/>

  <!-- Дома вдалеке -->
  <g fill="#9fb3c4">
    <rect x="6" y="58" width="34" height="52"/>
    <rect x="46" y="44" width="26" height="66"/>
    <rect x="160" y="52" width="34" height="58"/>
  </g>
  <g fill="#e1b16a" opacity=".8">
    <rect x="12" y="66" width="6" height="7"/>
    <rect x="24" y="80" width="6" height="7"/>
    <rect x="54" y="56" width="6" height="7"/>
    <rect x="168" y="70" width="6" height="7"/>
    <rect x="180" y="88" width="6" height="7"/>
  </g>

  <!-- Гора снега -->
  <path d="M0 200 L0 148 C40 130 60 92 110 78 C150 66 176 96 200 92 L200 200 Z" fill="#f2f7fa"/>
  <path d="M0 200 L0 168 C46 156 78 136 122 122 C158 110 178 122 200 118 L200 200 Z" fill="#e2ecf3"/>

  <!-- След от санок -->
  <path d="M118 88 C104 116 74 136 34 156" fill="none" stroke="#c9d9e4" stroke-width="7" stroke-linecap="round"/>

  <!-- Санки едут -->
  <g transform="translate(86 128) rotate(-24)">
    <rect x="-20" y="-6" width="40" height="8" rx="3" fill="#ce5a57"/>
    <path d="M-22 4 L20 4" stroke="#78a5a3" stroke-width="3" stroke-linecap="round"/>
    <path d="M-22 4 q-6 -2 -6 -7" fill="none" stroke="#78a5a3" stroke-width="3" stroke-linecap="round"/>
    <!-- Ребёнок -->
    <circle cx="0" cy="-24" r="8" fill="#f0dfc4"/>
    <path d="M-8 -28 q8 -11 16 0 q-8 -3 -16 0 Z" fill="#e1b16a"/>
    <path d="M-7 -16 q7 -5 14 0 l-2 10 h-10 Z" fill="#444c5c"/>
    <path d="M-7 -13 q-10 4 -12 10" fill="none" stroke="#444c5c" stroke-width="4" stroke-linecap="round"/>
    <path d="M7 -13 q10 4 12 10" fill="none" stroke="#444c5c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ждут наверху -->
  <g transform="translate(150 92)">
    <circle cx="0" cy="-24" r="8" fill="#f0dfc4"/>
    <path d="M-8 -28 q8 -11 16 0 q-8 -3 -16 0 Z" fill="#ce5a57"/>
    <path d="M-8 -15 q8 -5 16 0 l-3 20 h-10 Z" fill="#78a5a3"/>
    <path d="M-8 -12 q-11 4 -12 12" fill="none" stroke="#78a5a3" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M8 -12 q11 4 12 12" fill="none" stroke="#78a5a3" stroke-width="4.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(176 100)">
    <circle cx="0" cy="-20" r="6.5" fill="#f0dfc4"/>
    <path d="M-6.5 -24 q6.5 -9 13 0 q-6.5 -3 -13 0 Z" fill="#444c5c"/>
    <path d="M-6 -12 q6 -4 12 0 l-2 16 h-8 Z" fill="#e1b16a"/>
  </g>

  <!-- Снежинки -->
  <g fill="#ffffff">
    <circle cx="30" cy="36" r="2.5"/>
    <circle cx="92" cy="24" r="2"/>
    <circle cx="138" cy="44" r="2.5"/>
    <circle cx="196" cy="30" r="2"/>
  </g>
</svg>
