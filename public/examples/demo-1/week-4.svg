<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Финал: смотрим втроём на одном экране</title>

  <!-- Тёмная комната -->
  <rect width="200" height="200" fill="#20304a"/>
  <path d="M100 60 L200 10 L200 172 L0 172 L0 10 Z" fill="#2f496e" opacity=".55"/>

  <!-- Телевизор -->
  <rect x="26" y="16" width="148" height="90" rx="5" fill="#131d2e"/>
  <rect x="32" y="22" width="136" height="78" fill="#2988bc"/>

  <!-- Три фигуры на экране -->
  <g>
    <g transform="translate(66 62)">
      <circle cx="0" cy="-16" r="9" fill="#ed8c72"/>
      <path d="M-8 -6 q8 -5 16 0 l-3 22 h-10 Z" fill="#1d4d78"/>
      <path d="M-8 -3 q-9 6 -10 14" fill="none" stroke="#1d4d78" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M8 -3 q9 6 10 14" fill="none" stroke="#1d4d78" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(100 58)">
      <circle cx="0" cy="-18" r="10" fill="#f4eade"/>
      <path d="M-9 -7 q9 -5 18 0 l-3 24 h-12 Z" fill="#1d4d78"/>
      <path d="M-9 -4 q-10 -6 -11 -14" fill="none" stroke="#1d4d78" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M9 -4 q10 6 11 14" fill="none" stroke="#1d4d78" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(134 62)">
      <circle cx="0" cy="-16" r="9" fill="#ed8c72"/>
      <path d="M-8 -6 q8 -5 16 0 l-3 22 h-10 Z" fill="#1d4d78"/>
      <path d="M-8 -3 q-9 -6 -10 -14" fill="none" stroke="#1d4d78" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M8 -3 q9 6 10 14" fill="none" stroke="#1d4d78" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Паутинка между ними -->
  <g stroke="#f4eade" stroke-width="1.2" opacity=".75" fill="none">
    <path d="M76 50 L96 44"/>
    <path d="M112 44 L128 50"/>
  </g>

  <rect x="92" y="106" width="16" height="8" fill="#131d2e"/>
  <rect x="76" y="114" width="48" height="5" rx="2" fill="#131d2e"/>

  <!-- Диван -->
  <path d="M10 172 L10 132 q0 -10 10 -10 L180 122 q10 0 10 10 L190 172 Z" fill="#2f496e"/>
  <path d="M22 172 L22 138 q0 -6 6 -6 L172 132 q6 0 6 6 L178 172 Z" fill="#3a5a86"/>

  <!-- Четыре головы -->
  <g fill="#131d2e">
    <circle cx="48" cy="146" r="13"/>
    <circle cx="82" cy="140" r="11"/>
    <circle cx="116" cy="144" r="12"/>
    <circle cx="150" cy="141" r="12"/>
  </g>

  <!-- Миска попкорна -->
  <g transform="translate(178 160)">
    <circle cx="-4" cy="-12" r="4" fill="#f4eade"/>
    <circle cx="3" cy="-15" r="4.5" fill="#fdfcf8"/>
    <circle cx="9" cy="-11" r="4" fill="#f4eade"/>
    <path d="M-12 -10 L14 -10 L10 6 L-8 6 Z" fill="#ed8c72"/>
  </g>
</svg>
