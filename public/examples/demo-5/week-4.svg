<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Накрытый стол и гости</title>

  <!-- Комната -->
  <rect width="200" height="200" fill="#fef2e4"/>
  <rect y="120" width="200" height="80" fill="#e3cdab"/>
  <path d="M0 120 L200 120" stroke="#c9ab80" stroke-width="2"/>

  <!-- Стулья за столом -->
  <g fill="#805a3b">
    <rect x="24" y="96" width="26" height="34" rx="4"/>
    <rect x="86" y="90" width="28" height="40" rx="4"/>
    <rect x="150" y="96" width="26" height="34" rx="4"/>
  </g>

  <!-- Стол -->
  <ellipse cx="100" cy="140" rx="88" ry="30" fill="#fdf6e8"/>
  <path d="M12 140 q0 30 88 30 q88 0 88 -30 L188 140 Z" fill="#efe0c8"/>

  <!-- Пирог в центре -->
  <g transform="translate(100 134)">
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#c9a06a"/>
    <path d="M-30 0 q0 14 30 14 q30 0 30 -14 L30 -2 q0 12 -30 12 q-30 0 -30 -12 Z" fill="#b08752"/>
    <g stroke="#fdf6e8" stroke-width="2" opacity=".85">
      <path d="M-22 -4 L22 -4"/>
      <path d="M-16 -8 L16 4"/>
      <path d="M16 -8 L-16 4"/>
    </g>
    <circle cx="-8" cy="-6" r="3" fill="#c60000"/>
    <circle cx="9" cy="-3" r="3" fill="#c60000"/>
  </g>

  <!-- Банки с заготовками -->
  <g transform="translate(44 138)">
    <path d="M-13 -34 L13 -34 L13 0 L-13 0 Z" fill="#c60000"/>
    <path d="M-13 -34 L13 -34 L13 -28 L-13 -28 Z" fill="#a30000"/>
    <rect x="-15" y="-39" width="30" height="6" rx="2" fill="#9aa7ad"/>
    <rect x="-9" y="-22" width="18" height="10" rx="1.5" fill="#fdf6e8"/>
  </g>
  <g transform="translate(158 140)">
    <path d="M-12 -30 L12 -30 L12 0 L-12 0 Z" fill="#8fae4a"/>
    <path d="M-12 -30 L12 -30 L12 -25 L-12 -25 Z" fill="#7a9a3c"/>
    <rect x="-14" y="-35" width="28" height="6" rx="2" fill="#9aa7ad"/>
    <rect x="-8" y="-19" width="16" height="9" rx="1.5" fill="#fdf6e8"/>
  </g>

  <!-- Тарелки и чашки гостей -->
  <g>
    <ellipse cx="74" cy="158" rx="17" ry="6" fill="#ffffff"/>
    <ellipse cx="126" cy="158" rx="17" ry="6" fill="#ffffff"/>
    <ellipse cx="100" cy="166" rx="17" ry="6" fill="#ffffff"/>
  </g>
  <g fill="#fd974f">
    <path d="M52 152 q0 -9 8 -9 q8 0 8 9 q-3 6 -8 6 q-5 0 -8 -6 Z"/>
    <path d="M136 150 q0 -9 8 -9 q8 0 8 9 q-3 6 -8 6 q-5 0 -8 -6 Z"/>
  </g>

  <!-- Гости: головы над столом -->
  <g fill="#805a3b">
    <circle cx="37" cy="88" r="11"/>
    <circle cx="100" cy="80" r="12"/>
    <circle cx="163" cy="88" r="11"/>
  </g>
  <g fill="#fdf6e8" opacity=".9">
    <circle cx="33" cy="86" r="2"/>
    <circle cx="41" cy="86" r="2"/>
    <circle cx="96" cy="78" r="2.2"/>
    <circle cx="104" cy="78" r="2.2"/>
    <circle cx="159" cy="86" r="2"/>
    <circle cx="167" cy="86" r="2"/>
  </g>
</svg>
