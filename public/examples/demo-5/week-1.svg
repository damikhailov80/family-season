<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Урожай с бабушкиного огорода</title>

  <!-- Небо и грядки -->
  <rect width="200" height="200" fill="#cfe0ec"/>
  <path d="M0 92 C42 84 74 100 112 92 C148 85 176 98 200 92 L200 200 L0 200 Z" fill="#7a9a4a"/>
  <path d="M0 120 C48 112 82 130 122 120 C158 111 180 124 200 118 L200 200 L0 200 Z" fill="#5f7f36"/>
  <path d="M0 152 L200 146 L200 200 L0 200 Z" fill="#805a3b"/>

  <!-- Ботва на дальней грядке -->
  <g fill="#4d6a2b">
    <path d="M22 120 l7 -18 l7 18 z"/>
    <path d="M52 118 l7 -20 l7 20 z"/>
    <path d="M150 122 l7 -18 l7 18 z"/>
    <path d="M176 118 l7 -20 l7 20 z"/>
  </g>

  <!-- Ведро с помидорами -->
  <g transform="translate(58 148)">
    <circle cx="-12" cy="-16" r="10" fill="#c60000"/>
    <circle cx="4" cy="-20" r="11" fill="#d92b1a"/>
    <circle cx="18" cy="-14" r="9" fill="#c60000"/>
    <path d="M4 -31 l-4 -5 l8 0 z" fill="#4d6a2b"/>
    <path d="M-28 -12 L28 -12 L22 30 L-22 30 Z" fill="#9aa7ad"/>
    <path d="M-28 -12 L28 -12 L27 -5 L-27 -5 Z" fill="#7f8c93"/>
    <path d="M-20 -12 A20 22 0 0 1 20 -12" fill="none" stroke="#7f8c93" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Корзина с огурцами -->
  <g transform="translate(140 156)">
    <g fill="#4d7a2b">
      <ellipse cx="-11" cy="-13" rx="12" ry="5" transform="rotate(-16 -11 -13)"/>
      <ellipse cx="6" cy="-17" rx="12" ry="5" transform="rotate(8 6 -17)"/>
      <ellipse cx="16" cy="-10" rx="11" ry="5" transform="rotate(-6 16 -10)"/>
    </g>
    <path d="M-26 -8 L26 -8 L20 24 L-20 24 Z" fill="#b9832f"/>
    <g stroke="#805a3b" stroke-width="1.5" opacity=".75">
      <path d="M-24 0 L24 0"/>
      <path d="M-22 10 L22 10"/>
      <path d="M-12 -8 L-10 24"/>
      <path d="M6 -8 L6 24"/>
    </g>
  </g>

  <!-- Яблоко на земле -->
  <g transform="translate(96 182)">
    <circle cx="0" cy="0" r="8" fill="#c60000"/>
    <path d="M0 -8 l-1 -5 l4 1 z" fill="#4d6a2b"/>
  </g>
</svg>
